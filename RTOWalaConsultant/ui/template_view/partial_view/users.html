{% extends "layout_view/base.html" %}
{% load static %}
{% block content %}
<section id="users-page" class="page">
    <div class="page-header">
        <div>
            <h1>Manage Users</h1>
            <p>Create admin </p>
        </div><button class="btn-primary" onclick="openUserModal()">+ Add User</button>
    </div>
    <div class="content-card">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Name</th>
                    <th>Mobile</th>
                    <th>Email</th>
                    <th>Role</th>
                </tr>
            </thead>
            <tbody id="usersBody"></tbody>
        </table>
        <div id="usersPagination" class="pagination-wrapper"></div>
    </div>
</section>
<div id="userModal" class="modal-backdrop">
    <div class="modal">
        <form id="userForm" onsubmit="saveUser(event)">
            <div class="modal-header">
                <div>
                    <h2>Add User</h2>
                    <p>Create staff/admin login.</p>
                </div><button type="button" class="modal-close" data-close="userModal">×</button>
            </div>
            <div class="modal-body">
                <div class="form-grid">
                    <div class="form-group"><label>Username *</label><input id="uUsername" required></div>
                    <div class="form-group"><label>Name *</label><input id="uName" required></div>
                    <div class="form-group"><label>Mobile *</label><input id="uMobile" required></div>
                    <div class="form-group"><label>Email</label><input id="uEmail" type="email"></div>
                    <div class="form-group"><label>Password *</label><input id="uPassword" type="password" required>
                    </div>
                    <div class="form-group"><label>Role *</label><select id="uRole" required></select></div>
                </div>
            </div>
            <div class="modal-footer"><button type="button" class="btn-secondary"
                    data-close="userModal">Cancel</button><button class="btn-primary">Save User</button></div>
        </form>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{% static 'js/users.js' %}"></script>{% endblock %}
