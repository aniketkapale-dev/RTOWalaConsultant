{% load static %}
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RTO Consultant</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css">
  <link rel="stylesheet" href="{% static 'css/common/toast.css' %}">
  <link rel="stylesheet" href="{% static 'css/common/loader.css' %}">
  <link rel="stylesheet" href="{% static 'css/admin.css' %}">
</head>
<body>
  <div id="globalToastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>
  <div id="globalLoader" class="global-loader" aria-live="assertive" aria-busy="false">
    <div class="global-loader-box" role="status">
      <span class="global-loader-spinner" aria-hidden="true"></span>
      <span class="global-loader-text">Loading...</span>
    </div>
  </div>
  <aside class="sidebar">
    <div class="brand">RTOWalaConsultant<small>Admin Panel</small></div>
    <a class="nav-link" href="/dashboard/">▦ Dashboard</a>
    <a class="nav-link" href="/clients/">👥 Manage Client</a>
    <a class="nav-link" href="/vehicles/">🚘 Manage Vehicles</a>
    <a class="nav-link" href="/documents/">📄 Documents</a>
    <a class="nav-link" href="/update-insurance/">🛡 Update Insurance</a>
    <a class="nav-link" href="/users/">👤 Users</a>
    <!-- <a class="nav-link" href="/error-logs/">⚠ Error Logs</a> -->
    <div class="sidebar-footer"><button class="logout-btn" onclick="logout()">↪ Logout</button></div>
  </aside>
  <main class="content">
    <div class="topbar"><div class="topbar-title">Welcome back. Manage clients, vehicles and RTO documents.</div><div>🔔 ⚙️</div></div>
    {% block content %}{% endblock %}
  </main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="{% static 'js/common/toast.js' %}"></script>
  <script src="{% static 'js/common/loader.js' %}"></script>
  <script src="{% static 'js/common/validation.js' %}"></script>
  <script src="{% static 'js/common.js' %}"></script>
  <script src="{% static 'js/common/select2-init.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
